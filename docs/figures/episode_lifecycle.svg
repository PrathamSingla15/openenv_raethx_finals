<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="100%">
    <defs>
        <marker id="arrEL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="#22D3EE"/>
        </marker>
    </defs>
    <rect width="880" height="240" fill="#0A0E13"/>
    <line x1="40" y1="195" x2="840" y2="195" stroke="#1F2731" stroke-width="1"/>
    <line x1="40" y1="195" x2="840" y2="195" stroke="#22D3EE" stroke-width="1.5" stroke-dasharray="2 6" opacity="0.45"/>
    <text x="40" y="220" font-family="JetBrains Mono, monospace" font-size="11" fill="#7A8693">t (decision)</text>
    <text x="840" y="220" font-family="JetBrains Mono, monospace" font-size="11" fill="#7A8693" text-anchor="end">t+1 (next session)</text>

    <g font-family="JetBrains Mono, monospace" font-size="11">
        <rect x="60" y="50" width="120" height="60" rx="4" fill="#11161D" stroke="#22D3EE"/>
        <text x="120" y="72" text-anchor="middle" fill="#22D3EE" font-size="10" letter-spacing="1.4">OBSERVE</text>
        <text x="120" y="90" text-anchor="middle" fill="#7A8693" font-size="10">data ≤ t</text>
        <text x="120" y="104" text-anchor="middle" fill="#7A8693" font-size="10">read-only</text>

        <rect x="220" y="50" width="120" height="60" rx="4" fill="#11161D" stroke="#22D3EE"/>
        <text x="280" y="72" text-anchor="middle" fill="#22D3EE" font-size="10" letter-spacing="1.4">ACT</text>
        <text x="280" y="90" text-anchor="middle" fill="#7A8693" font-size="10">queue orders</text>
        <text x="280" y="104" text-anchor="middle" fill="#7A8693" font-size="10">no fills yet</text>

        <rect x="380" y="50" width="120" height="60" rx="4" fill="#1A2029" stroke="#22D3EE" stroke-width="1.5"/>
        <text x="440" y="72" text-anchor="middle" fill="#22D3EE" font-size="10" letter-spacing="1.4">SETTLE</text>
        <text x="440" y="90" text-anchor="middle" fill="#E6E8EB" font-size="10">next-open fills</text>
        <text x="440" y="104" text-anchor="middle" fill="#E6E8EB" font-size="10">corp actions</text>

        <rect x="540" y="50" width="120" height="60" rx="4" fill="#1A2029" stroke="#22D3EE" stroke-width="1.5"/>
        <text x="600" y="72" text-anchor="middle" fill="#22D3EE" font-size="10" letter-spacing="1.4">REWARD</text>
        <text x="600" y="90" text-anchor="middle" fill="#E6E8EB" font-size="10">composite emit</text>
        <text x="600" y="104" text-anchor="middle" fill="#E6E8EB" font-size="10">7 components</text>

        <rect x="700" y="50" width="120" height="60" rx="4" fill="#11161D" stroke="#22D3EE"/>
        <text x="760" y="72" text-anchor="middle" fill="#22D3EE" font-size="10" letter-spacing="1.4">OBSERVE'</text>
        <text x="760" y="90" text-anchor="middle" fill="#7A8693" font-size="10">data ≤ t+1</text>
        <text x="760" y="104" text-anchor="middle" fill="#7A8693" font-size="10">FS refreshed</text>
    </g>

    <g stroke="#22D3EE" stroke-width="1.4" fill="none" marker-end="url(#arrEL)">
        <line x1="180" y1="80" x2="220" y2="80"/>
        <line x1="340" y1="80" x2="380" y2="80"/>
        <line x1="500" y1="80" x2="540" y2="80"/>
        <line x1="660" y1="80" x2="700" y2="80"/>
    </g>

    <g font-family="JetBrains Mono, monospace" font-size="10" fill="#7A8693">
        <text x="120" y="145" text-anchor="middle">SQL PIT, date gate</text>
        <text x="120" y="160" text-anchor="middle">progressive FS</text>

        <text x="280" y="145" text-anchor="middle">turnover cap</text>
        <text x="280" y="160" text-anchor="middle">decision_required</text>

        <text x="440" y="145" text-anchor="middle">slippage 50bps</text>
        <text x="440" y="160" text-anchor="middle">deterministic order</text>

        <text x="600" y="145" text-anchor="middle">drains scanners:</text>
        <text x="600" y="160" text-anchor="middle">r_rules / r_hack</text>

        <text x="760" y="145" text-anchor="middle">refresh_allowed_files</text>
        <text x="760" y="160" text-anchor="middle">advance_day +1</text>
    </g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="100%">
    <rect width="880" height="320" fill="#0A0E13"/>
    <!-- Top eyebrow -->
    <text x="40" y="36" font-family="JetBrains Mono, monospace" font-size="11"
          fill="#22D3EE" letter-spacing="2">REWARDBREAKDOWN · 7 COMPONENTS</text>
    <text x="40" y="60" font-family="Fraunces, serif" font-size="20" fill="#E6E8EB"
          font-style="italic">r_total = r_wealth + 0.5 · Σ secondary</text>

    <!-- 7 stacked bars -->
    <g font-family="JetBrains Mono, monospace" font-size="11" fill="#E6E8EB">
        <!-- r_wealth -->
        <text x="40" y="105">r_wealth</text>
        <rect x="200" y="93" width="200" height="14" fill="#1F2731" rx="2"/>
        <rect x="200" y="93" width="120" height="14" fill="#5BC97D" rx="2"/>
        <text x="420" y="105" fill="#7A8693">unbounded · primary</text>

        <!-- r_sharpe_bonus -->
        <text x="40" y="135">r_sharpe_bonus</text>
        <rect x="200" y="123" width="200" height="14" fill="#1F2731" rx="2"/>
        <rect x="200" y="123" width="180" height="14" fill="#22D3EE" rx="2"/>
        <text x="420" y="135" fill="#7A8693">[ 0, 0.20 ]  ·  rolling Sharpe / 2</text>

        <!-- r_drawdown -->
        <text x="40" y="165">r_drawdown</text>
        <rect x="200" y="153" width="200" height="14" fill="#1F2731" rx="2"/>
        <rect x="320" y="153" width="80" height="14" fill="#E37D78" rx="2"/>
        <text x="420" y="165" fill="#7A8693">[ -0.30, 0 ]  ·  -(dd_pct)²</text>

        <!-- r_turnover -->
        <text x="40" y="195">r_turnover</text>
        <rect x="200" y="183" width="200" height="14" fill="#1F2731" rx="2"/>
        <rect x="360" y="183" width="40" height="14" fill="#E37D78" rx="2"/>
        <text x="420" y="195" fill="#7A8693">[ -0.10, 0 ]  ·  -0.2·(turn-0.5)⁺</text>

        <!-- r_concentration -->
        <text x="40" y="225">r_concentration</text>
        <rect x="200" y="213" width="200" height="14" fill="#1F2731" rx="2"/>
        <rect x="360" y="213" width="40" height="14" fill="#E37D78" rx="2"/>
        <text x="420" y="225" fill="#7A8693">[ -0.10, 0 ]  ·  -0.2·(HHI-0.5)⁺</text>

        <!-- r_rules -->
        <text x="40" y="255">r_rules</text>
        <rect x="200" y="243" width="200" height="14" fill="#1F2731" rx="2"/>
        <rect x="200" y="243" width="200" height="14" fill="#9F4F4B" rx="2"/>
        <text x="420" y="255" fill="#7A8693">{ -1, 0 }  ·  rules-clause hit</text>

        <!-- r_hack -->
        <text x="40" y="285">r_hack</text>
        <rect x="200" y="273" width="200" height="14" fill="#1F2731" rx="2"/>
        <rect x="200" y="273" width="200" height="14" fill="#9F4F4B" rx="2"/>
        <text x="420" y="285" fill="#7A8693">{ -1, 0 }  ·  forbidden-global</text>
    </g>

    <!-- divider + total label -->
    <line x1="40" y1="305" x2="840" y2="305" stroke="#1F2731" stroke-width="1"/>
</svg>
